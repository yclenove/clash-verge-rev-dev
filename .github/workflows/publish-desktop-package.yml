name: Publish Desktop Package

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Desktop Package run ID
        required: true
        type: string
      tag:
        description: Existing release tag
        required: true
        type: string
        default: v2.5.3-dev.1

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Upload artifacts to release
    runs-on: ubuntu-latest
    steps:
      - name: Download Desktop Package artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" --dir artifacts
          find artifacts -type f -print

      - name: Upload files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t files < <(find artifacts -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No artifact files found"
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" --repo "${{ github.repository }}" --clobber "${files[@]}"
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}"
